# Settings used online (the Dockerfile turns on the "prod" profile).
# Every value comes from an environment variable set in the hosting dashboard, so no secrets live in the code.
# If one is missing, the app refuses to start instead of running with an unsafe default.

# MongoDB Atlas connection string, e.g. mongodb+srv://user:password@cluster0.xxxxx.mongodb.net/navya_portfolio
spring.data.mongodb.uri=${MONGODB_URI}

# Secret key for changing the photo / reading contact messages
portfolio.admin-key=${ADMIN_KEY}

# The website address(es) allowed to call this API, e.g. https://navya-portfolio.netlify.app
portfolio.cors.allowed-origins=${CORS_ORIGINS}
