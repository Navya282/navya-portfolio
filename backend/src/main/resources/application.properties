spring.application.name=portfolio-backend
# Hosting services (like Render) tell the app which port to use through PORT; locally it's 8080
server.port=${PORT:8080}

# MongoDB (local). Online, application-prod.properties takes this from MONGODB_URI instead.
spring.data.mongodb.uri=mongodb://localhost:27017/navya_portfolio

# Photo upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
portfolio.upload-dir=uploads

# Key required to change the photo or read contact messages (send as X-Admin-Key header).
# Local development key only; online it must come from the ADMIN_KEY environment variable.
portfolio.admin-key=navya-admin-123

# When true, profile-seed.json is re-loaded into MongoDB on every startup,
# so editing that file + restarting is all you need to update the site content.
portfolio.seed.reload-on-startup=true

# Frontend origins allowed to call the API (patterns: * = any port)
portfolio.cors.allowed-origins=http://localhost:*,http://127.0.0.1:*
